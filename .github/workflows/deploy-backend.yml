name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend-render:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    steps:
      - name: Trigger Backend Deploy Webhook
        env:
          BACKEND_DEPLOY_WEBHOOK_URL: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$BACKEND_DEPLOY_WEBHOOK_URL" ]; then
            echo "::error::Secret BACKEND_DEPLOY_WEBHOOK_URL is missing. Please configure it in your GitHub Repository Secrets."
            exit 1
          fi

          echo "Triggering Backend deployment on Render..."
          HTTP_RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST "$BACKEND_DEPLOY_WEBHOOK_URL")

          echo "Render responded with HTTP status: $HTTP_RESPONSE"
          cat response.txt || true
          echo ""

          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
            echo "Backend deployment triggered successfully!"
          else
            echo "::error::Backend deployment hook failed with status code $HTTP_RESPONSE"
            exit 1
          fi
